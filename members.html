<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - V Team Fitness Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-compact">
                    <span class="logo-text">VT</span>
                </div>
                <button class="menu-toggle" id="menuToggle">☰</button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="members.html" class="nav-link active" data-page="members">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">Members</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <h1>Members Management</h1>
                <button class="btn-primary" id="addMemberBtn">➕ Add Member</button>
            </div>

            <!-- Search & Filter Section -->
            <div class="members-controls">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Search by name or phone..."
                    >
                </div>
                
                <div class="filter-controls">
                    <select id="statusFilter" class="filter-select">
                        <option value="all">All Members</option>
                        <option value="active">Active</option>
                        <option value="expired">Expired</option>
                        <option value="expiring">Expiring Soon</option>
                    </select>
                    <button class="btn-secondary" id="refreshBtn">🔄 Refresh</button>
                </div>
            </div>

            <!-- Members Display -->
            <div class="members-container">
                <!-- Loading State -->
                <div id="loadingState" class="loading-state" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading members...</p>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <p>👤 No members found</p>
                </div>

                <!-- Members List -->
                <div id="membersList" class="members-list">
                    <!-- Members will be populated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Member Modal -->
    <div id="memberModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Member</h2>
                <button class="modal-close" id="closeModal">✕</button>
            </div>

            <form id="memberForm" class="member-form">
                <!-- Name -->
                <div class="form-group">
                    <label for="memberName">Name *</label>
                    <input type="text" id="memberName" placeholder="Full Name" required>
                    <span class="error-message" id="nameError"></span>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="memberPhone">Phone Number *</label>
                    <input type="tel" id="memberPhone" placeholder="+919876543210" required>
                    <span class="error-message" id="phoneError"></span>
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label for="memberGender">Gender *</label>
                    <select id="memberGender" required>
                        <option value="">Select Gender</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <!-- Membership Type -->
                <div class="form-group">
                    <label for="membershipType">Membership Type *</label>
                    <select id="membershipType" required>
                        <option value="">Select Type</option>
                        <option value="MONTHLY">Monthly</option>
                        <option value="QUARTERLY">Quarterly</option>
                        <option value="YEARLY">Yearly</option>
                    </select>
                </div>

                <!-- Duration -->
                <div class="form-group">
                    <label for="duration">Duration *</label>
                    <select id="duration" required>
                        <option value="">Select Duration</option>
                    </select>
                    <span class="error-message" id="durationError"></span>
                </div>

                <!-- Join Date -->
                <div class="form-group">
                    <label for="joinDate">Join Date *</label>
                    <input type="date" id="joinDate" required>
                    <span class="error-message" id="joinDateError"></span>
                </div>

                <!-- Expiry Date -->
                <div class="form-group">
                    <label for="expiryDate">Expiry Date *</label>
                    <input type="date" id="expiryDate" required>
                    <span class="error-message" id="expiryDateError"></span>
                </div>

                <!-- Form Buttons -->
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">Save Member</button>
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal" style="display: none;">
        <div class="modal-content confirm-modal">
            <h2>Delete Member?</h2>
            <p id="deleteConfirmText">Are you sure you want to delete this member?</p>
            <div class="modal-buttons">
                <button class="btn-danger" id="confirmDeleteBtn">Delete</button>
                <button class="btn-secondary" id="cancelDeleteBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        window.firebaseConfig = {
            apiKey: "AIzaSyBD--itijs4RziHUWMdQA3jAvZ9hgNhzBo",
            authDomain: "vteam-fitness.firebaseapp.com",
            databaseURL: "https://vteam-fitness-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vteam-fitness",
            storageBucket: "vteam-fitness.firebasestorage.app",
            messagingSenderId: "1019346733178",
            appId: "1:1019346733178:web:59d3a64d8dd838aa5c13c3"
        };

        const app = initializeApp(window.firebaseConfig);
        window.auth = getAuth(app);
        window.database = getDatabase(app);
    </script>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/members.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/members-page.js"></script>
</body>
</html>
